services:
  - type: web
    name: pado-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: pado-db
      mountPath: /data
      sizeGB: 1

  - type: web
    name: pado-frontend
    env: node
    buildCommand: "cd pado-web && npm install && npm run build"
    startCommand: "cd pado-web && npm start"
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: pado-backend
          envVarKey: RENDER_EXTERNAL_URL
